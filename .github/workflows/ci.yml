name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 e 3.13 sono check richiesti dalla protezione di main; 3.12 aggiunto da MCP-CI
        # (PF-OWNER-MCP-PARALLEL-EXECUTION-20261111). I nomi dei job non cambiano.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (lock con hash)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/dev.lock
          pip install --no-deps -e .
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest (unit, integration, e2e stdio, guard)
        id: pytest
        run: |
          set +e
          pytest --cov --cov-report=term --junitxml=pytest-junit.xml
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      # Nessuno skip silenzioso: ogni skip deve essere dichiarato come ambientale nel manifest.
      - name: Classificazione degli esiti (linux)
        if: always() && steps.pytest.outputs.rc != ''
        run: >-
          python scripts/ci_platform_report.py --platform linux
          --junit pytest-junit.xml --expectations ci/platform_expectations.json
          --pytest-rc ${{ steps.pytest.outputs.rc }} --summary "$GITHUB_STEP_SUMMARY"

  # MCP-CI: Windows NON è un check richiesto finché MCP-WIN non è pronta e verificata
  # (decisione owner). Il job non è mai verde per finta: i test dichiarati bloccati in
  # ci/platform_expectations.json danno BLOCKED_BY_DEPENDENCY:MCP-WIN (uscita 3, job rosso),
  # ogni altro fallimento o skip non dichiarato dà FAIL (uscita 1).
  windows:
    name: windows, test (py${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (lock con hash, nessun fallback senza hash)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .
      - name: Pytest (senza gate di copertura, che resta su Linux)
        id: pytest
        run: |
          set +e
          # Un modulo non importabile su Windows non deve fermare gli altri: l'errore di
          # raccolta finisce nel JUnit e il classificatore lo tratta come ogni altro esito.
          python -m pytest --continue-on-collection-errors --junitxml=pytest-junit.xml
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Classificazione degli esiti (windows)
        if: always() && steps.pytest.outputs.rc != ''
        run: >-
          python scripts/ci_platform_report.py --platform windows
          --junit pytest-junit.xml --expectations ci/platform_expectations.json
          --pytest-rc ${{ steps.pytest.outputs.rc }} --summary "$GITHUB_STEP_SUMMARY"

  critical-mutations:
    name: mutazioni dei controlli critici (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (lock con hash)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/dev.lock
      - name: Catalogo mutanti critici
        run: python scripts/critical_mutations.py --json critical-mutations.json
      # Report nel log, non come artifact: nessun consumo della quota di storage.
      - name: Report mutanti critici
        if: always()
        run: cat critical-mutations.json || true

  mutmut:
    name: mutation testing generale (soglia 85%)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (lock con hash, senza installare il pacchetto)
        # Il pacchetto non va installato: mutmut deve importare i sorgenti mutati.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/dev.lock
      - name: mutmut run
        run: mutmut run --max-children 4
      - name: Gate sul punteggio
        run: python scripts/mutmut_gate.py --fail-under 85 --json mutmut-report.json
      - name: Report mutmut
        if: always()
        run: cat mutmut-report.json || true
